        worktree: /repo/peasant/peasant-5--feat--thing/worktree/nested-b
        started_at: "2026-08-01T00:00:00Z"
        ended_at: "2026-08-04T00:00:00Z"
    expect:
      - {pr: "peasant-labs/peasant#10", session: s3, method: exact}

  - name: subagent_inherits_parent_keys
