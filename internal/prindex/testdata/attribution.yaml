scenarios:
  - name: exact_worktree_path
    repo_host: /repo/peasant
    ignored_branches: [main, develop]
    prs:
      - repo: peasant-labs/peasant
        number: 10
        head_ref: peasant-5--feat--thing
        created_at: "2026-07-25T00:00:00Z"
        merged_at: "2026-08-10T00:00:00Z"
    sessions:
      - id: s1
        worktree: /repo/peasant/peasant-5--feat--thing
        started_at: "2026-08-01T00:00:00Z"
        ended_at: "2026-08-05T00:00:00Z"
    expect:
      - {pr: "peasant-labs/peasant#10", session: s1, method: exact}

  - name: branch_key_on_host_checkout
    repo_host: /repo/peasant
    ignored_branches: [main, develop]
    prs:
      - repo: peasant-labs/peasant
        number: 10
        head_ref: peasant-5--feat--thing
        created_at: "2026-07-25T00:00:00Z"
        merged_at: "2026-08-10T00:00:00Z"
    sessions:
      - id: s2
        worktree: /repo/peasant
        branch: peasant-5--feat--thing
        started_at: "2026-08-01T00:00:00Z"
        ended_at: "2026-08-06T00:00:00Z"
    expect:
      - {pr: "peasant-labs/peasant#10", session: s2, method: exact}

