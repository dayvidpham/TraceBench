        worktree: /repo/peasant/peasant-5--feat--thing
        started_at: "2026-08-01T00:00:00Z"
        ended_at: "2026-08-05T00:00:00Z"
      - id: s4
        parent_id: s1
        project_cwd: /repo/.claude/worktrees/agent-1
        started_at: "2026-08-02T00:00:00Z"
        ended_at: "2026-08-03T00:00:00Z"
    expect:
      - {pr: "peasant-labs/peasant#10", session: s1, method: exact}
      - {pr: "peasant-labs/peasant#10", session: s4, method: exact}

