schema_version = "1.4"
artifacts = []

[task]
name = "tracebench/peasant-smoke"
version = "1.0.0"
description = "Containerized peasant codebase smoke task: build the binary and run a fast unit-test package. Proves the task codebase starts from the image (issue #1)."
keywords = ["peasant", "go", "containerization", "smoke"]

[[task.authors]]
name = "TraceBench"

[metadata]
category = "programming"
difficulty_explanation = "Smoke task, not a bug fix: build peasant at a pinned commit and run one fast test package. Difficulty is environment setup, not code reasoning."
tags = ["peasant", "go", "smoke"]
# Pinned peasant commit: 4153b0026c9e73157ef663368a7bb497c022afc1
# (keep in sync with environment/Dockerfile PEASANT_SHA).

[agent]
timeout_sec = 600.0
# Agent gets zero network during agent.run(). Setup stays on the
# environment baseline so the harness can be copied in.
network_mode = "no-network"

[verifier]
timeout_sec = 600.0
# Verifier runs offline. Modules are baked and GOPROXY=off.
network_mode = "no-network"

[environment]
# Baseline is public so agent.setup() (harness install) works.
# [agent] and [verifier] above lock the network for run and verify.
network_mode = "public"
build_timeout_sec = 1200.0
os = "linux"
mcp_servers = []

[environment.env]

[solution.env]
