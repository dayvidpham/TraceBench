[project]
name = "tracebench"
version = "0.1.0"
description = "TraceBench workspace root: corpus loader and task tooling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-SA-4.0" }
dependencies = ["tracebench-corpus"]

[dependency-groups]
dev = ["pytest>=8", "PyYAML>=6", "huggingface_hub>=0.30",
       "harbor==0.23.0; python_version >= '3.12'"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["loaders"]

[tool.uv.sources]
tracebench-corpus = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["loaders/tests", "reporting/tests"]
