[project]
name = "tracebench-corpus"
version = "0.1.0"
description = "Loader and per-PR bundle materializer for the TraceBench Peasant PR corpus"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-SA-4.0" }
dependencies = []

[project.optional-dependencies]
hf = ["huggingface_hub>=0.30"]
test = ["pytest>=8", "PyYAML>=6"]
harbor = ["harbor==0.23.0; python_version >= '3.12'", "PyYAML>=6"]

[project.scripts]
tracebench-corpus = "tracebench_corpus.cli:main"
tracebench-harbor = "tracebench_corpus.local_run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tracebench_corpus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
